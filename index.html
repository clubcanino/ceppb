<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libro de Cría CEPPB</title>
<meta name="description" content="Libro de cría del Club Español del Perro Pastor Belga: censo de socios, ejemplares y Reglamento de Cría.">
<link rel="icon" href="assets/emblema-ceppb.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/estilo.css?v=2">
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <img class="crest-light" src="assets/emblema-ceppb.png" alt="Emblema del CEPPB">
      <img class="crest-dark" src="assets/emblema-ceppb-oscuro.webp" alt="">
      <div>
        <b>Libro de Cría</b>
        <span>CEPPB</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span id="rol-badge" class="eyebrow"></span>
      <button class="btn sm" id="tema" title="Alternar claro / oscuro">Tema</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="tt">Novedades</h1>
        <div class="sub" id="ts"></div>
      </div>
      <div class="spacer"></div>
      <div id="acciones"></div>
    </header>
    <div class="page" id="vista"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=2"></script>
<script src="js/util.js?v=2"></script>
<script src="js/reglamento.js?v=2"></script>
<script src="js/privacidad.js?v=2"></script>
<script src="js/componentes.js?v=2"></script>
<script src="js/sesion.js?v=2"></script>
<script src="js/datos.js?v=2"></script>
<script src="js/vistas/entrar.js?v=2"></script>
<script src="js/vistas/muro.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
