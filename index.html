<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libro de Cría CEPPB</title>
<meta name="description" content="Libro de cría del Club Español del Perro Pastor Belga: censo de socios, ejemplares y Reglamento de Cría.">
<link rel="icon" href="assets/emblema-ceppb.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/estilo.css?v=13">
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <img class="crest-light" src="assets/emblema-ceppb.png" alt="Emblema del CEPPB">
      <img class="crest-dark" src="assets/emblema-ceppb-oscuro.webp" alt="">
      <div>
        <b>Libro de Cría</b>
        <span>CEPPB</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span id="rol-badge" class="eyebrow"></span>
      <button class="btn sm" id="tema" title="Alternar claro / oscuro">Tema</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="tt">Novedades</h1>
        <div class="sub" id="ts"></div>
      </div>
      <div class="spacer"></div>
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input class="inp" id="q" placeholder="Buscar socio, perro, afijo, LOE…" autocomplete="off">
      </div>
      <div id="acciones"></div>
    </header>
    <div class="page" id="vista"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-h">
    <h3 id="sheet-t">Formulario</h3>
    <div class="spacer"></div>
    <button class="btn sm" id="sheet-x">Cerrar</button>
  </div>
  <div class="sheet-b" id="sheet-b"></div>
  <div class="sheet-f">
    <button class="btn" id="sheet-c">Cancelar</button>
    <button class="btn brand" id="sheet-ok">Guardar</button>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=13"></script>
<script src="js/util.js?v=13"></script>
<script src="js/reglamento.js?v=13"></script>
<script src="js/privacidad.js?v=13"></script>
<script src="js/componentes.js?v=13"></script>
<script src="js/media.js?v=13"></script>
<script src="js/sesion.js?v=13"></script>
<script src="js/columnas.js?v=13"></script>
<script src="js/datos.js?v=13"></script>
<script src="js/formularios.js?v=13"></script>
<script src="js/formularios-def.js?v=13"></script>
<script src="js/vistas/entrar.js?v=13"></script>
<script src="js/vistas/muro.js?v=13"></script>
<script src="js/vistas/ajustes.js?v=13"></script>
<script src="js/vistas/diagnostico.js?v=13"></script>
<script src="js/vistas/socios.js?v=13"></script>
<script src="js/vistas/perros.js?v=13"></script>
<script src="js/vistas/cria.js?v=13"></script>
<script src="js/vistas/camadas-eventos.js?v=13"></script>
<script src="js/vistas/mi-area.js?v=13"></script>
<script src="js/vistas/junta.js?v=13"></script>
<script src="js/vistas/club.js?v=13"></script>
<script src="js/app.js?v=13"></script>
<script src="js/eventos.js?v=13"></script>
</body>
</html>
