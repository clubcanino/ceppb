<title>Libro de Cría CEPPB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   Identidad tomada del emblema del CEPPB:
   rojo #FF000E · oro #FFCF00 · tinta #141311
   Motto del club: "belleza y funcionalidad" — las dos vías del
   reglamento de cría (estructura / utilidad) llevan cada una su color.
   ============================================================ */
:root{
  --ground:#f3f1ed; --surface:#ffffff; --surface-2:#faf7f3; --surface-3:#efeae2;
  --ink:#141311; --ink-2:#494339; --muted:#797166; --faint:#a79d90;
  --line:#e6dfd5; --line-2:#d3c9bb;
  --brand:#d3040f; --brand-str:#a90309; --brand-pure:#ff000e; --on-brand:#fffaf8;
  --gold:#b58500; --gold-pure:#ffcf00;
  --via-est:#b58500; --via-uti:#d3040f;
  --ok:#1f7a4d; --ok-bg:#e7f1ea; --ok-line:#b3d4c1;
  --warn:#8a5a08; --warn-bg:#f9efd8; --warn-line:#e5cf98;
  --block:#9b1c1c; --block-bg:#f8e7e4; --block-line:#e4bcb6;
  --v-mal:#b8822f; --v-ter:#9c4a25; --v-gro:#333a47; --v-lae:#867749;
  --sh-1:0 1px 2px rgba(35,25,15,.07);
  --sh-2:0 1px 2px rgba(35,25,15,.06), 0 10px 26px -18px rgba(35,25,15,.4);
  --r:8px; --r-sm:5px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Archivo","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121110; --surface:#1b1917; --surface-2:#221f1d; --surface-3:#2b2724;
    --ink:#f5f1eb; --ink-2:#d0c8bd; --muted:#9a9186; --faint:#6e675f;
    --line:#302c28; --line-2:#443e37;
    --brand:#ff5a63; --brand-str:#ff8189; --brand-pure:#ff000e; --on-brand:#1a0607;
    --gold:#ffcf00; --gold-pure:#ffcf00;
    --via-est:#ffcf00; --via-uti:#ff5a63;
    --ok:#5cc294; --ok-bg:#152a20; --ok-line:#2b4a39;
    --warn:#e0b25e; --warn-bg:#2a2113; --warn-line:#4c3c1d;
    --block:#f0736f; --block-bg:#2c1917; --block-line:#4e2926;
    --v-mal:#d6a355; --v-ter:#cd6f45; --v-gro:#93a0b6; --v-lae:#bda876;
    --sh-1:0 1px 2px rgba(0,0,0,.5);
    --sh-2:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#121110; --surface:#1b1917; --surface-2:#221f1d; --surface-3:#2b2724;
  --ink:#f5f1eb; --ink-2:#d0c8bd; --muted:#9a9186; --faint:#6e675f;
  --line:#302c28; --line-2:#443e37;
  --brand:#ff5a63; --brand-str:#ff8189; --brand-pure:#ff000e; --on-brand:#1a0607;
  --gold:#ffcf00; --gold-pure:#ffcf00;
  --via-est:#ffcf00; --via-uti:#ff5a63;
  --ok:#5cc294; --ok-bg:#152a20; --ok-line:#2b4a39;
  --warn:#e0b25e; --warn-bg:#2a2113; --warn-line:#4c3c1d;
  --block:#f0736f; --block-bg:#2c1917; --block-line:#4e2926;
  --v-mal:#d6a355; --v-ter:#cd6f45; --v-gro:#93a0b6; --v-lae:#bda876;
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:700;text-wrap:balance;letter-spacing:-.018em;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.crest-dark{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .crest-light{display:none}
  :root:not([data-theme="light"]) .crest-dark{display:block}
}
:root[data-theme="dark"] .crest-light{display:none}
:root[data-theme="dark"] .crest-dark{display:block}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500}

/* ---------- armazón ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}
.brand img{width:42px;height:42px;object-fit:contain;flex:none}
.brand b{display:block;font-family:var(--disp);font-size:15.5px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.brand span{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px;flex:1}
.nav-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);padding:15px 10px 6px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);text-decoration:none;color:var(--ink-2);font-size:13.5px;font-weight:500;position:relative}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--surface-3);color:var(--ink);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav a .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.side-foot{padding:11px 12px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;justify-content:space-between}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 28px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.topbar h1{font-size:20px;font-weight:700}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px}
.spacer{flex:1}
.page{padding:22px 28px 64px;max-width:1420px;width:100%}

/* ---------- portada ---------- */
.masthead{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-2);margin-bottom:18px}
.mast-top{display:flex;gap:20px;align-items:center;padding:22px 26px 20px;flex-wrap:wrap;position:relative;z-index:1}
.mast-top img{width:82px;height:82px;object-fit:contain;flex:none}
.mast-top h2{font-size:27px;font-weight:800;letter-spacing:-.028em}
.mast-top .motto{font-family:var(--disp);font-size:14.5px;font-weight:600;color:var(--muted);margin-top:5px;letter-spacing:.005em}
.mast-top .motto em{font-style:normal;color:var(--gold)}
.mast-top .motto i{font-style:normal;color:var(--brand)}
.flag{height:4px;display:flex}
.flag i{display:block;height:100%}
.flag i:nth-child(1){flex:1;background:var(--brand-pure)}
.flag i:nth-child(2){flex:2;background:var(--gold-pure)}
.flag i:nth-child(3){flex:1;background:var(--brand-pure)}
.mast-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--line)}
.mast-stats .stat{border-right:1px solid var(--line)}
.mast-stats .stat:last-child{border-right:0}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;box-shadow:var(--sh-1)}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn.brand{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.brand:hover{background:var(--brand-str);border-color:var(--brand-str)}
.btn.sm{padding:3px 10px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp,select.inp,textarea.inp{width:100%;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);font-size:13px}
.inp:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
textarea.inp{min-height:66px;resize:vertical;line-height:1.45}
.search{position:relative;flex:0 1 250px}
.search .inp{padding-left:29px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.45}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{width:auto;min-width:118px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 11px;cursor:pointer;font-size:12px;color:var(--muted);border-right:1px solid var(--line);font-weight:500}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--ground);font-weight:600}

/* ---------- superficies ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.card.lift{box-shadow:var(--sh-2)}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:14.5px;font-weight:700}
.card-h .hint{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto;letter-spacing:.04em}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--disp);font-size:29px;font-weight:800;line-height:1.05;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat .n{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}

/* ---------- tablas ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-1)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:9px 13px;border-bottom:1px solid var(--line-2);background:var(--surface-2);position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
th.nos{cursor:default}
th .ar{color:var(--brand);font-size:9px}
td{padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tr.clic{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
.nm{font-weight:600}
.dim{color:var(--faint)}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--disp);font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px}

/* ---------- distintivos ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.chip.block{background:var(--block-bg);color:var(--block);border-color:var(--block-line)}
.chip.mono{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.02em}
.chip.est{background:var(--surface-2);color:var(--via-est);border-color:var(--via-est)}
.chip.uti{background:var(--surface-2);color:var(--via-uti);border-color:var(--via-uti)}
.var-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.vM{background:var(--v-mal)} .vT{background:var(--v-ter)} .vG{background:var(--v-gro)} .vL{background:var(--v-lae)}
.sexo{font-family:var(--mono);font-weight:600;font-size:14px}

/* medidor de las cinco figuras */
.meter{display:flex;gap:3px;align-items:center}
.meter i{display:block;width:15px;height:5px;border-radius:2px;background:var(--line-2)}
.meter i.on{background:var(--ok)}
.meter i.x{background:var(--block)}

/* ---------- requisitos ---------- */
.reqs{display:flex;flex-direction:column}
.req{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.req:last-child{border-bottom:0}
.req .mk{width:17px;height:17px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;margin-top:1px}
.req .mk.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.req .mk.falta{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.req .mk.no{background:var(--block-bg);color:var(--block);border:1px solid var(--block-line)}
.req .tx{min-width:0}
.req .tx b{font-weight:600;font-size:13px}
.req .tx small{display:block;color:var(--muted);font-size:11.5px;line-height:1.4}

/* ---------- figuras de apto ---------- */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(262px,1fr));gap:12px}
.fig{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-1)}
.fig::before{content:"";display:block;height:3px;background:var(--via)}
.fig[data-via="mixta"]::before{background:linear-gradient(90deg,var(--via-est),var(--via-uti))}
.fig.cumple{border-color:var(--ok-line)}
.fig-h{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.fig.cumple .fig-h{background:var(--ok-bg)}
.fig-h .code{font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:-.02em;color:var(--via)}
.fig-h .nm2{font-size:11.5px;color:var(--muted);line-height:1.25}
.fig-b{padding:6px 14px 12px;flex:1}

/* ---------- fotos y vídeos ---------- */
.avatar{border-radius:50%;object-fit:cover;background:var(--surface-3);border:1px solid var(--line-2);flex:none}
img.avatar{display:block}
.avatar.ph{display:inline-grid;place-items:center;font-family:var(--disp);font-weight:700;color:var(--faint);letter-spacing:-.02em}
.avatar.cuadrado{border-radius:var(--r)}
.avatar.centrado{margin:0 auto}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2);position:relative}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface-3)}
.gal figcaption{padding:7px 10px;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;border-top:1px solid var(--line)}
.gal .acts{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .14s}
.gal figure:hover .acts,.gal figure:focus-within .acts{opacity:1}
.gal .vid{aspect-ratio:4/3;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);text-decoration:none}
.gal .vid:hover{color:var(--brand);background:var(--surface-2)}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:24px 18px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5}
.btn.danger{color:var(--block);border-color:var(--block-line)}
.thumb{width:34px;height:34px;border-radius:var(--r-sm);object-fit:cover;background:var(--surface-3);border:1px solid var(--line);display:block;flex:none}
.celda-nm{display:flex;gap:10px;align-items:center;min-width:0}

/* ---------- pedigrí ---------- */
.ped{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;min-width:560px}
.ped-col{display:flex;flex-direction:column;gap:6px;justify-content:space-around}
.ped-n{border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:var(--r-sm);padding:7px 10px;background:var(--surface-2);min-height:46px;display:flex;flex-direction:column;justify-content:center}
.ped-n.m{border-left-color:var(--v-gro)} .ped-n.h{border-left-color:var(--v-ter)}
.ped-n b{font-size:12.5px;font-weight:600;line-height:1.25}
.ped-n small{font-family:var(--mono);font-size:10px;color:var(--muted)}
.ped-n.vacio{background:transparent;border-style:dashed;color:var(--faint);font-size:11px;align-items:center;justify-content:center}

/* ---------- barras ---------- */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;font-size:12.5px}
.bar .tr{height:8px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.bar .fl{height:100%;border-radius:2px;background:var(--ink-2)}
.bar .vl{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}

/* ---------- panel lateral ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,14,10,.45);z-index:60;display:none}
.scrim.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(530px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:61;display:none;flex-direction:column;box-shadow:-18px 0 46px -26px rgba(0,0,0,.55)}
.sheet.on{display:flex}
.sheet-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet-h h3{font-size:17px;font-weight:700}
.sheet-b{padding:18px 20px;overflow-y:auto;flex:1}
.sheet-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2)}
.fset{border:0;padding:0;margin:0 0 20px}
.fset legend{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 0 9px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.f{display:flex;flex-direction:column;gap:3px}
.f.wide{grid-column:1/-1}
.f label{font-size:11.5px;color:var(--ink-2);font-weight:500}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;background:var(--surface)}
.chk{display:flex;gap:7px;align-items:center;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.chk input{margin:0;flex:none}
.f .hint2{font-size:10.5px;color:var(--faint);line-height:1.35}

/* ---------- fichas ---------- */
.ficha-h{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.ficha-h h2{font-size:29px;font-weight:800;letter-spacing:-.03em}
.ficha-h .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted);font-size:11.5px;padding-top:1px}
.kv dd{margin:0;font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 13px;cursor:pointer;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols23{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
.note{padding:10px 13px;border-radius:var(--r-sm);font-size:12.5px;border:1px solid var(--line-2);background:var(--surface-2);line-height:1.45}
.note.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.note.block{background:var(--block-bg);border-color:var(--block-line);color:var(--block)}
.note.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 18px;border-radius:20px;font-size:13px;z-index:90;box-shadow:var(--sh-2);opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
.linkish{color:var(--brand);text-decoration:none;font-weight:600;cursor:pointer}
.linkish:hover{text-decoration:underline}
.mini{font-size:11.5px;color:var(--muted);line-height:1.4}
.rule-src{font-size:11px;color:var(--faint);font-style:italic}
.badge-ej{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px dashed var(--line-2);padding:1px 6px;border-radius:3px;vertical-align:middle}
.feed-row{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.feed-row:last-child{border-bottom:0}
.feed-row .when{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none;width:64px;padding-top:2px;text-align:right}

@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav-h{display:none}
  .nav a.on::before{display:none}
  .nav a.on{box-shadow:inset 0 -2px 0 var(--brand)}
  .page,.topbar{padding-left:16px;padding-right:16px}
  .cols2,.cols23{grid-template-columns:1fr}
  .mast-top h2{font-size:22px}
  .feed-row .when{width:auto}
}

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId = (arr, id) => arr.find(x => x.id === id);
const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hoy = () => new Date().toISOString().slice(0, 10);
function fmtF(f){ if(!f) return "—"; const p=String(f).slice(0,10).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:f; }
function meses(desde, hasta){
  if(!desde) return null;
  const a=new Date(desde), b=hasta?new Date(hasta):new Date();
  if(isNaN(a)) return null;
  return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) - (b.getDate()<a.getDate()?1:0);
}
function edadTxt(m){ if(m==null) return "—"; const a=Math.floor(m/12), r=m%12; return a? `${a} a${r?` ${r} m`:""}` : `${m} m`; }
function toast(t){ const n=$("#toast"); n.textContent=t; n.classList.add("on"); clearTimeout(n._t); n._t=setTimeout(()=>n.classList.remove("on"),2600); }
function norm(s){ return String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }

const TIPOS_EVENTO = ["Especial de Cría","Monográfica de Zona","Especial Regional","Exposición FCI","Prueba de carácter CEPPB","Prueba de confirmación","CNI","CNM","Concurso monográfico CEPPB","Otro"];

/* Las cinco figuras de apto de cría — Capítulo 2 del reglamento */
const FIGURAS = [
  {c:"ACE",  n:"Apto de Cría de Estructura",           edad:15, via:"estructura", estr:{min:"MB",  n:2, ceppb:true},  caracter:"TS", art:"2.1"},

  {c:"ACSS", n:"Apto Cría Gran Seleccionado CEPPB",    edad:20, via:"mixta",      estr:{min:"EXC", n:2, ceppb:true, edadMin:18}, trabajo:["IGP3","MR3"], art:"2.5"},

/* Cruces intervariedades autorizados — Capítulo 8.2 */
const CRUCES_INTER = [
  {a:"Malinois",  b:"Tervueren",    nota:"Sólo Tervueren fuego. No se permiten grises ni deslavados."},
  {a:"Malinois",  b:"Laekenois",    nota:"Sólo si el Malinois es portador del gen de pelo duro."},
  {a:"Tervueren", b:"Groenendael",  nota:"Cruce autorizado por el reglamento."},

/* ============================================================
   Motor de reglas
   ============================================================ */
const R = {};

/* Anexo A — requisitos veterinarios comunes a las cinco figuras */
R.anexoA = function(p){
  const s = p.salud || {}, items = [];
  const val = s.validacion || {};
  items.push({k:"val", t:"Expediente de salud validado por el club",
    d: val.estado === "validado" ? `Validado el ${fmtF(val.fecha)}${val.por?" · "+val.por:""}`
      : val.estado === "rechazado" ? `Rechazado: ${val.nota || "documentación no conforme"}`
      : "Pendiente de que la Comisión de Cría coteje los certificados",
    e: val.estado === "validado" ? "ok" : val.estado === "rechazado" ? "no" : "falta",
    r:"Los datos los aporta el propietario; sólo cuentan una vez cotejados por el club"});
  const hd = (s.hd||"").toUpperCase();
  items.push({k:"hd", t:"Displasia de cadera", d: hd ? `Grado ${hd}${s.hdEntidad?" · "+s.hdEntidad:""}` : "Sin diagnóstico registrado",
    e: !hd ? "falta" : (HD_OK.includes(hd) ? "ok" : "no"), r:"Anexo A.1 — sólo A o B"});
  const ed = String(s.ed ?? "");
  items.push({k:"ed", t:"Displasia de codo", d: ed!=="" ? `Grado ${ed}${s.edEntidad?" · "+s.edEntidad:""}` : "Sin diagnóstico registrado",
    e: ed==="" ? "falta" : (ED_OK.includes(ed) ? "ok" : "no"), r:"Anexo A.2 — sólo 0 o 1"});
  const lvt = s.lvt||"";
  items.push({k:"lvt", t:"Vértebra de transición (LVT)", d: lvt ? (lvt==="libre"?"Libre de LVT":"Con vértebra de transición") : "Radiografías no tramitadas",
    e: !lvt ? "falta" : (lvt==="libre" ? "ok" : "no"), r:"Anexo A.3 — diagnóstico del CEPPB, sólo libres"});
  GENES.forEach(g => {
    const v = (s.genes||{})[g.k] || "";
    items.push({k:"gen"+g.k, t:g.k, d: v ? v[0].toUpperCase()+v.slice(1) : "Sin analizar", gen:true,
      e: !v ? "falta" : (v==="afectado" ? "no" : "ok"), r:`Anexo A.4 — ${g.n}. Afectado: excluido. Portador: sólo con libre`});
  });
  items.push({k:"adn", t:"ADN de progenitores", d: p.adnProgenitores ? "Verificado (RSCE)" : "Sin verificar",
    e: p.adnProgenitores ? "ok" : "falta", r:"Cap. 2 — verificación de pureza de línea (regulación RSCE)"});
  return {items, ok: items.every(i => i.e === "ok"), bloqueos: items.filter(i => i.e === "no")};
};

/* Resultados de un perro, agrupados */
R.esValidado = x => (x && x.validado) === "validado";
R.res = function(perroId, resultados, incluirNoValidados){
  const r = resultados.filter(x => x.perroId === perroId && (incluirNoValidados || R.esValidado(x)));
  return {
    estructura: r.filter(x => x.tipo === "estructura"),
    caracter:   r.filter(x => x.tipo === "caracter"),
    trabajo:    r.filter(x => x.tipo === "trabajo"),
    confirm:    r.filter(x => x.tipo === "confirmacion"),
    todos: r,
  };
};

/* ¿Tiene título de trabajo de grado n o superior? */
R.tieneTrabajo = function(rs, lista){
  const grados = {IGP1:1,IGP2:2,IGP3:3,MR1:1,MR2:2,MR3:3};
  const fam = t => t.startsWith("IGP") ? "IGP" : (t.startsWith("MR") ? "MR" : "");
  return rs.trabajo.some(x => lista.some(req => fam(x.titulo||"") === fam(req) && (grados[x.titulo]||0) >= (grados[req]||9)));
};
R.mejorTrabajo = function(rs){
  const grados = {IGP1:1,IGP2:2,IGP3:3,"IGP-FH":2,MR1:1,MR2:2,MR3:3};
  let best = null;
  rs.trabajo.forEach(x => { if(!best || (grados[x.titulo]||0) > (grados[best]||0)) best = x.titulo; });
  return best;
};

/* Prueba de carácter. Cap. 4: TS y TC se convalidan a quien ostente FCI-IGP1 o Mondioring 1 */
R.caracter = function(rs, nivel){
  const apto = m => rs.caracter.some(x => x.modalidad === m && x.resultado === "APTO");
  const conv = R.tieneTrabajo(rs, ["IGP1","MR1"]);
  if(nivel === "TC"){
    if(apto("TC")) return {e:"ok", d:"Prueba completa superada"};
    if(conv)       return {e:"ok", d:"Convalidada por título de trabajo (IGP 1 / Mondioring 1)"};
    return {e:"falta", d: apto("TS") ? "Tiene la simple; falta la prueba de coraje" : "Sin prueba de carácter completa"};
  }
  if(apto("TS") || apto("TC")) return {e:"ok", d: apto("TC") ? "Prueba completa superada (incluye la simple)" : "Prueba simple superada"};
  if(conv) return {e:"ok", d:"Convalidada por título de trabajo (IGP 1 / Mondioring 1)"};
  const susp = rs.caracter.some(x => x.resultado === "NO APTO");
  return {e: susp ? "no" : "falta", d: susp ? "Presentado sin superar la prueba" : "Sin prueba de carácter"};
};

/* Calificaciones de estructura que valen para una figura */
R.estructura = function(rs, req, fechaNac){
  let vals = rs.estructura.filter(x => (CAL_RANK[x.calificacion]||0) >= (CAL_RANK[req.min]||0));
  if(req.edadMin && fechaNac) vals = vals.filter(x => (meses(fechaNac, x.fecha) ?? 0) >= req.edadMin);
  const ceppb = vals.filter(x => x.organizadoCEPPB);
  const okN = vals.length >= req.n;
  const okC = !req.ceppb || ceppb.length >= 1;
  let d;
  if(okN && okC) d = `${vals.length} calificación(es) de ${req.min} o superior` + (req.ceppb ? `, ${ceppb.length} en evento del CEPPB` : "");
  else if(!okN) d = `${vals.length} de ${req.n} calificaciones de ${req.min} o superior` + (req.edadMin ? ` con ${req.edadMin}+ meses` : "");
  else d = `Faltan calificaciones obtenidas en un evento organizado por el CEPPB`;
  return {e: (okN && okC) ? "ok" : "falta", d, n: vals.length, ceppb: ceppb.length};
};

/* Evalúa una figura de apto de cría para un perro */
R.figura = function(p, fig, rs){
  const items = [];
  const m = meses(p.fechaNacimiento);
  items.push({t:`Edad mínima ${fig.edad} meses`, d: m==null ? "Sin fecha de nacimiento" : `${edadTxt(m)} (${m} meses)`,
    e: m==null ? "falta" : (m >= fig.edad ? "ok" : "falta"), r:`Cap. ${fig.art}`});
  const a = R.anexoA(p);
  items.push({t:"Pruebas de salud (Anexo A)", d: a.ok ? "Todos los requisitos veterinarios cumplidos"
      : (a.bloqueos.length ? `Excluido por: ${a.bloqueos.map(b=>b.t).join(", ")}` : `Faltan ${a.items.filter(i=>i.e==="falta").length} pruebas`),
    e: a.ok ? "ok" : (a.bloqueos.length ? "no" : "falta"), r:"Anexo A"});
  const es = R.estructura(rs, fig.estr, p.fechaNacimiento);
  items.push({t:`Estructura: ${fig.estr.n}× ${fig.estr.min} o superior` + (fig.estr.ceppb ? " (una en evento CEPPB)" : " en evento FCI") + (fig.estr.edadMin ? ` con ${fig.estr.edadMin}+ meses` : ""),
    d: es.d, e: es.e, r:`Cap. ${fig.art}`});
  if(fig.caracter){
    const c = R.caracter(rs, fig.caracter);
    items.push({t: fig.caracter === "TC" ? "Prueba de carácter e instintos COMPLETA" : "Prueba de carácter SIMPLE", d:c.d, e:c.e, r:"Cap. 4"});
  }
  if(fig.trabajo){
    const ok = R.tieneTrabajo(rs, fig.trabajo);
    const mej = R.mejorTrabajo(rs);
    items.push({t:`Prueba de trabajo: ${fig.trabajo.join(" o ")}`, d: ok ? `Acredita ${mej}` : (mej ? `Máximo acreditado: ${mej}` : "Sin título de trabajo registrado"),
      e: ok ? "ok" : "falta", r:`Cap. ${fig.art}`});
  }
  const cumple = items.every(i => i.e === "ok");
  const excluido = items.some(i => i.e === "no");
  return {fig, items, cumple, excluido, faltan: items.filter(i => i.e !== "ok").length};
};

R.figurasDe = function(p, resultados){
  const rs = R.res(p.id, resultados);
  return FIGURAS.map(f => R.figura(p, f, rs));
};
R.aptosDe = function(p, resultados){
  return R.figurasDe(p, resultados).filter(x => x.cumple).map(x => x.fig.c);
};

/* Baremo de puntuación — Cap. 7 */
R.puntosResultado = function(r, modo){
  let pts = 0;
  if(modo === "granch"){
    if(r.calificacion === "EXC") pts = ({1:14,2:12,3:11,4:10})[r.puesto] || 8;
    else if(r.calificacion === "MB") pts = 3;
  } else {
    if(["CAC","CACIB","CCPB","Rappel CAC"].includes(r.distincion)) pts = 12;
    else if(["RCAC","RCACIB","RCCPB"].includes(r.distincion)) pts = 10;
    else if(r.calificacion === "EXC") pts = 8;
    else if(r.calificacion === "MB") pts = 3;
    if(r.distincion === "BOB") pts += 2;
  }
  if(r.tipoEvento === "Especial de Cría") pts = Math.round(pts * 1.5 * 10) / 10;
  return pts;
};
R.puntuacion = function(perroId, resultados, modo, anio){
  const rs = R.res(perroId, resultados);
  let base = rs.estructura.filter(r => !anio || String(r.fecha||"").slice(0,4) === String(anio));
  if(modo !== "granch"){ // RA / Ch. Club: cada sujeto puntúa una sola vez, la mejor puntuación
    const mejorPor = {};
    base.forEach(r => { const k = r.tipoEvento || "otro"; const p = R.puntosResultado(r, modo);
      if(!mejorPor[k] || p > mejorPor[k].p) mejorPor[k] = {p, r}; });
    base = Object.values(mejorPor).map(x => x.r);
  }
  let total = base.reduce((s,r) => s + R.puntosResultado(r, modo), 0);
  const car = rs.caracter.filter(x => x.resultado === "APTO");
  if(car.some(x => x.modalidad === "TC")) total += 6;
  else if(car.some(x => x.modalidad === "TS")) total += 4;
  const especial = base.some(r => r.tipoEvento === "Especial de Cría");
  return {total: Math.round(total*10)/10, detalle: base, especial};
};

/* Reproductor Superior A/B — Cap. 7 (progenie con apto de cría, de dos alianzas distintas) */
R.reproductorSuperior = function(p, perros, resultados){
  const hijos = perros.filter(x => x.padreId === p.id || x.madreId === p.id);
  const conApto = hijos.filter(h => R.aptosDe(h, resultados).length > 0);
  const alianzas = new Set(conApto.map(h => (h.padreId === p.id ? h.madreId : h.padreId) || "desconocido"));
  const min = p.sexo === "M" ? 4 : 3;
  const propio = R.aptosDe(p, resultados).length > 0;
  return {hijos: hijos.length, conApto: conApto.length, alianzas: alianzas.size, min,
    rsB: conApto.length >= min && alianzas.size >= 2,
    rsA: propio && conApto.length >= min && alianzas.size >= 2};
};

/* Validador de cruce — Cap. 1.III, Cap. 8 y Anexo A.4 */
R.cruce = function(macho, hembra, perros, resultados, fecha){
  const out = [];
  const f = fecha || hoy();
  if(!macho || !hembra) return [{n:"falta", t:"Selecciona un macho y una hembra"}];
  if(macho.sexo !== "M") out.push({n:"bloqueo", t:`${macho.nombre} no está registrado como macho`});
  if(hembra.sexo !== "H") out.push({n:"bloqueo", t:`${hembra.nombre} no está registrada como hembra`});

  const em = meses(macho.fechaNacimiento, f), eh = meses(hembra.fechaNacimiento, f);
  if(em == null) out.push({n:"aviso", t:"El macho no tiene fecha de nacimiento registrada", r:"Cap. 1.III"});
  else if(em < 15) out.push({n:"bloqueo", t:`Macho con ${edadTxt(em)}: la edad mínima de monta es 15 meses`, r:"Cap. 1.III"});
  else if(em > 144) out.push({n:"bloqueo", t:`Macho con ${edadTxt(em)}: el límite reglamentario son 12 años`, r:"Cap. 1.III"});
  if(eh == null) out.push({n:"aviso", t:"La hembra no tiene fecha de nacimiento registrada", r:"Cap. 1.III"});
  else if(eh < 18) out.push({n:"bloqueo", t:`Hembra con ${edadTxt(eh)}: la edad mínima de cría es 18 meses`, r:"Cap. 1.III"});
  else if(eh > 108) out.push({n:"bloqueo", t:`Hembra con ${edadTxt(eh)}: el límite reglamentario son 9 años`, r:"Cap. 1.III"});

  [[macho,"Macho"],[hembra,"Hembra"]].forEach(([p,rol]) => {
    const aptos = R.aptosDe(p, resultados);
    if(!aptos.length) out.push({n:"bloqueo", t:`${rol} ${p.nombre} no tiene ningún apto de cría del CEPPB`, r:"Cap. 1 §4.1"});
    else out.push({n:"ok", t:`${rol} ${p.nombre}: ${aptos.join(", ")}`});
    const a = R.anexoA(p);
    a.bloqueos.forEach(b => out.push({n:"bloqueo", t:`${rol}: ${b.t} — ${b.d}`, r:b.r}));
  });

  GENES.forEach(g => {
    const gm = (macho.salud?.genes||{})[g.k] || "", gh = (hembra.salud?.genes||{})[g.k] || "";
    if(gm === "afectado" || gh === "afectado")
      out.push({n:"bloqueo", t:`${g.k}: ejemplar afectado — el cruce nunca está permitido`, r:"Anexo A.4"});
    else if(gm === "portador" && gh === "portador")
      out.push({n:"bloqueo", t:`${g.k}: portador × portador — un portador sólo puede cruzarse con un ejemplar libre`, r:"Anexo A.4"});
    else if(gm === "portador" || gh === "portador")
      out.push({n:"aviso", t:`${g.k}: portador × libre — permitido; hasta el 50 % de la camada será portadora`, r:"Anexo A.4"});
    else if(!gm || !gh)
      out.push({n:"aviso", t:`${g.k}: falta el análisis genético de ${!gm ? "el macho" : ""}${!gm&&!gh?" y ":""}${!gh ? "la hembra" : ""}`, r:"Anexo A.4"});
  });

  if(macho.variedad && hembra.variedad && macho.variedad !== hembra.variedad){
    const ok = CRUCES_INTER.find(c => (c.a===macho.variedad&&c.b===hembra.variedad)||(c.b===macho.variedad&&c.a===hembra.variedad));
    if(ok) out.push({n:"aviso", t:`Cruce intervariedades ${macho.variedad} × ${hembra.variedad}: autorizado por el reglamento pero requiere solicitud previa a la Comisión de Cría. ${ok.nota}`, r:"Cap. 8.2"});
    else out.push({n:"bloqueo", t:`Cruce ${macho.variedad} × ${hembra.variedad} no está entre los autorizados por el CEPPB`, r:"Cap. 8.2 — uniones directas entre variedades prohibidas"});
  }

  if(macho.padreId && hembra.padreId && macho.padreId === hembra.padreId)
    out.push({n:"aviso", t:"Ambos comparten padre: consanguinidad alta, valórese la diversidad genética", r:"Preámbulo"});
  if(macho.id === hembra.padreId || hembra.id === macho.madreId)
    out.push({n:"aviso", t:"Cruce entre progenitor y descendiente", r:"Preámbulo"});

  return out;
};
R.cruceVeredicto = function(lista){
  if(lista.some(x => x.n === "bloqueo")) return "bloqueo";
  if(lista.some(x => x.n === "aviso")) return "aviso";
  return "ok";
};

/* Requisitos del expediente de cruce intervariedades — Capítulo 8 */
R.intervariedad = function(macho, hembra, ctx){
  const items = [], cr = ctx.criador || null;
  const pagos = (ctx.pagos || []).filter(p => cr && p.socioId === cr.id);
  const debe = pagos.filter(p => p.estado !== "pagado").length;
  items.push({t:"Criador socio del CEPPB y al día en sus obligaciones", r:"Cap. 8.3.1",
    d: !cr ? "Sin criador asignado" : (debe ? `${debe} recibo(s) pendientes` : "Al corriente"),
    e: !cr ? "falta" : (debe ? "no" : "ok")});
  items.push({t:"Afijo de criador FCI/RSCE", r:"Cap. 8.3.2",
    d: cr && cr.afijo ? cr.afijo : "Sin afijo registrado en la ficha del socio",
    e: cr && cr.afijo ? "ok" : "falta"});
  items.push({t:"Cruce entre las variedades autorizadas", r:"Cap. 8.2",
    d: (()=>{ const ok = CRUCES_INTER.find(c => (c.a===macho.variedad&&c.b===hembra.variedad)||(c.b===macho.variedad&&c.a===hembra.variedad));
      return ok ? `${macho.variedad} × ${hembra.variedad}. ${ok.nota}` : `${macho.variedad} × ${hembra.variedad} no figura entre los cruces admitidos`; })(),
    e: CRUCES_INTER.some(c => (c.a===macho.variedad&&c.b===hembra.variedad)||(c.b===macho.variedad&&c.a===hembra.variedad)) ? "ok" : "no"});
  [[macho,"macho"],[hembra,"hembra"]].forEach(([p,rol]) => {
    const s = p.salud || {};
    items.push({t:`Radiografías de cadera y codos del ${rol}`, r:"Cap. 8.4.2.3",
      d: `${p.nombre}: HD ${s.hd||"—"} · ED ${s.ed!==undefined&&s.ed!==""?s.ed:"—"}`,
      e: (s.hd && s.ed!==undefined && s.ed!=="") ? (HD_OK.includes(s.hd)&&ED_OK.includes(String(s.ed)) ? "ok" : "no") : "falta"});
  });
  items.push({t:"Identificación genética (ADN) de ambos reproductores", r:"Cap. 8.4.2.4",
    d: [macho,hembra].filter(p=>p.adnProgenitores).length + " de 2 verificados",
    e: (macho.adnProgenitores && hembra.adnProgenitores) ? "ok" : "falta"});
  const gen = k => [macho,hembra].map(p => (p.salud?.genes||{})[k] || "");
  const ataxia = ["SDCA1","SDCA2"].every(k => gen(k).every(v => v === "libre"));
  const faltaAtaxia = ["SDCA1","SDCA2"].some(k => gen(k).some(v => !v));
  items.push({t:"Exentos de ataxia cerebelosa (SDCA1 y SDCA2)", r:"Cap. 8.4.2.5.1",
    d: ataxia ? "Ambos libres" : faltaAtaxia ? "Falta algún análisis" : "Algún reproductor no es libre",
    e: ataxia ? "ok" : faltaAtaxia ? "falta" : "no"});
  items.push({t:"Exentos de carcinoma gástrico", r:"Cap. 8.4.2.5.2",
    d: "Se acredita con el informe del laboratorio; no se deduce de la ficha",
    e: "falta"});
  const aptos = p => R.aptosDe(p, ctx.resultados || []);
  const conApto = [macho,hembra].every(p => aptos(p).length);
  items.push({t:"Mérito de los reproductores", r:"Cap. 8.5, 8.6 y 8.7",
    d: conApto ? `Sustituido por los aptos de cría del club: ${macho.nombre} (${aptos(macho).join(", ")}) y ${hembra.nombre} (${aptos(hembra).join(", ")})`
      : "Sin apto de cría: hay que acreditar calificaciones y pruebas de la línea solicitada",
    e: conApto ? "ok" : "falta"});
  return {items, completo: items.every(i => i.e === "ok"), bloqueos: items.filter(i => i.e === "no")};
};

/* Qué le queda a un ejemplar por validar */
R.pendientes = function(p, resultados){
  const val = (p.salud || {}).validacion || {};
  const conDatos = ["hd","ed","lvt"].some(k => (p.salud||{})[k]) || Object.keys((p.salud||{}).genes || {}).length;
  const salud = conDatos && val.estado !== "validado" && val.estado !== "rechazado" ? 1 : 0;
  const res = resultados.filter(x => x.perroId === p.id && !x.validado).length;
  return {salud, resultados: res, total: salud + res};
};

/* ¿Es intervariedades este cruce? */
R.esInter = (m, h) => !!(m && h && m.variedad && h.variedad && m.variedad !== h.variedad);
/* ============================================================
   Almacén: colecciones persistentes del artefacto
   ============================================================ */
const COLS = ["socios","socios_privado","perros","camadas","eventos","resultados","inscripciones","pagos","solicitudes","config","muro"];
const S = {db:null, listo:false, esAdmin:false, data:Object.fromEntries(COLS.map(c=>[c,[]])), subs:[]};

async function abrirDB(){
  try { S.db = await claude.use("db"); } catch(e){ S.db = null; }
  if(!S.db){ S.listo = true; render(); return; }
  // sondeo de permisos: socios_privado sólo es legible con permiso de edición
  try { const p = await S.db.doc("socios_privado/1").get(); S.esAdmin = p.exists; } catch(e){ S.esAdmin = false; }
  let pend = COLS.length;
  COLS.forEach(c => {
    S.subs.push(S.db.collection(c).onSnapshot(snap => {
      S.data[c] = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      if(pend > 0){ pend--; if(pend === 0){ S.listo = true; } }
      render();
    }, err => { if(pend>0){pend--; if(!pend) S.listo=true;} console.warn(c, err); render(); }));
  });
  setTimeout(() => { if(!S.listo){ S.listo = true; render(); } }, 6000);
}
const C = c => S.data[c] || [];
async function guardar(col, id, datos){
  const nid = id || uid(col.slice(0,3));
  if(!S.db){ const i = S.data[col].findIndex(x=>x.id===nid);
    if(i>=0) S.data[col][i] = Object.assign({}, S.data[col][i], datos, {id:nid}); else S.data[col].push(Object.assign({id:nid}, datos));
    render(); return nid; }
  try { await S.db.doc(`${col}/${nid}`).set(datos); return nid; }
  catch(e){ toast(e.code === "invalid_argument" ? "No tienes permiso de edición sobre este dato" : "No se pudo guardar: " + (e.message||e.code)); throw e; }
}
async function borrar(col, id){
  if(!S.db){ S.data[col] = S.data[col].filter(x=>x.id!==id); render(); return; }
  try { await S.db.doc(`${col}/${id}`).delete(); } catch(e){ toast("No se pudo borrar: "+(e.code||"")); }
}

  afijo:"privado", disciplinas:"privado", bio:"privado", web:"privado", fechaAlta:"privado",
  rsce:"privado", variedades:"privado", grupoTrabajo:"privado", redes:"privado",
  profesion:"privado", fechaNacimiento:"privado"};
/* El número de cuenta no figura aquí y no es compartible en ningún nivel. */
function nivelDe(socio, campo){ return (socio.priv||{})[campo] || PRIV_DEF[campo] || "privado"; }
function perfilVisible(s){
  if(!s) return false;
  if(SES.rol === "admin" || esYo(s.id)) return true;
  const n = s.perfilPublico || "oculto";
  return n === "publico" || (n === "socios" && SES.rol === "socio");
}
function visible(socio, campo){
  if(SES.rol === "admin" || esYo(socio.id)) return true;
  if(!perfilVisible(socio)) return false;
  const n = nivelDe(socio, campo);
  return n === "publico" || (n === "socios" && SES.rol === "socio");
}
function nombreSocio(id){                       // nunca revela a quien no se ha dado a conocer
  const s = byId(C("socios"), id);
  if(!s) return "";
  return perfilVisible(s) ? s.nombreCompleto : "Socio del club";
}
function perroVisible(p){
  if(SES.rol === "admin" || (p.propietarioId && esYo(p.propietarioId))) return true;
  const v = p.visibilidad || "socios";
  return v === "publico" || (v === "socios" && SES.rol === "socio");
}
function perrosVisibles(){ return C("perros").filter(perroVisible); }

function chipVal(estado){
  const [c,t] = VAL_CHIP[estado || "pendiente"] || VAL_CHIP.pendiente;

function afijoChip(p){
  if(!p.afijo) return `<span class="dim">—</span>`;

function chipVar(v){ return v ? `<span class="chip"><span class="var-dot ${VCLASE[v]||""}"></span>${esc(v)}</span>` : `<span class="dim">—</span>`; }
function chipApto(codes){
  if(!codes.length) return `<span class="dim">—</span>`;

function marca(e){ return `<span class="mk ${e}">${e==="ok"?"✓":e==="no"?"✕":"·"}</span>`; }
function medidor(figs){
  return `<span class="meter" title="Las cinco figuras del Cap. 2">` + figs.map(f =>
    `<i class="${f.cumple?"on":f.excluido?"x":""}" title="${esc(f.fig.c)}"></i>`).join("") + `</span>`;
}
const VIA_COLOR = {estructura:"var(--via-est)", utilidad:"var(--via-uti)", mixta:"var(--via-uti)"};
function listaReq(items){
  return `<div class="reqs">` + items.map(i => `<div class="req">${marca(i.e)}
    <div class="tx"><b>${esc(i.t)}</b><small>${esc(i.d)}${i.r?` · <span class="rule-src">${esc(i.r)}</span>`:""}</small></div></div>`).join("") + `</div>`;
}
function barras(pares, color){
  const max = Math.max(1, ...pares.map(p => p[1]));
  return `<div class="bars">` + pares.map(([l,v,cl]) => `<div class="bar">
      <span class="lb">${cl?`<span class="var-dot ${cl}"></span>`:""}${esc(l)}</span>
      <span class="tr"><span class="fl" style="width:${(v/max*100).toFixed(1)}%${cl?`;background:var(--${color||"ink-2"})`:""}"></span></span>
      <span class="vl">${v}</span></div>`).join("") + `</div>`;
}
let ordenTabla = {soc:{c:0, d:false}, alt:{c:0, d:false}, cob:{c:0, d:false}};
function tabla(key, cols, filas, onClick){
  const o = ordenTabla[key] || {};
  if(o.c != null){
    const col = cols[o.c];
    filas = filas.slice().sort((a,b) => {
      const va = col.s ? col.s(a) : "", vb = col.s ? col.s(b) : "";
      const r = (typeof va === "number" && typeof vb === "number") ? va - vb : String(va).localeCompare(String(vb), "es");
      return o.d ? -r : r;
    });
  }
  if(!filas.length) return `<div class="tw"><div class="empty"><b>Sin resultados</b>Ajusta los filtros o añade el primer registro.</div></div>`;
  return `<div class="tw"><table><thead><tr>` +
    cols.map((c,i) => `<th class="${c.s?"":"nos"}" ${c.s?`data-ord="${key}|${i}"`:""} ${c.via?`style="color:${VIA_COLOR[c.via]}"`:""}>${esc(c.t)}${o.c===i?` <span class="ar">${o.d?"▼":"▲"}</span>`:""}</th>`).join("") +
    `</tr></thead><tbody>` +
    filas.map(f => `<tr class="${onClick?"clic":""}" ${onClick?`data-go="${esc(onClick(f))}"`:""}>` + cols.map(c => `<td>${c.r(f)}</td>`).join("") + `</tr>`).join("") +
    `</tbody></table></div>`;
}

/* --- Buscador de ejemplares --- */
let fPer = {q:"", var:"", sexo:"", apto:"", salud:"", afijo:""};
V.perros = function(){
  let l = perrosVisibles();
  if(fPer.q){ const q = norm(fPer.q); l = l.filter(p => norm([p.nombre,p.afijo,p.loe,p.chip,p.criadorNombre].join(" ")).includes(q)); }
  if(fPer.var) l = l.filter(p => p.variedad === fPer.var);
  if(fPer.sexo) l = l.filter(p => p.sexo === fPer.sexo);
  const res = C("resultados");
  if(fPer.apto === "si") l = l.filter(p => R.aptosDe(p, res).length);
  if(fPer.apto === "no") l = l.filter(p => !R.aptosDe(p, res).length);
  if(fPer.apto && FIG_POR_CODIGO[fPer.apto]) l = l.filter(p => R.aptosDe(p, res).includes(fPer.apto));
  if(fPer.salud === "completa") l = l.filter(p => R.anexoA(p).ok);
  if(fPer.salud === "pendiente") l = l.filter(p => !R.anexoA(p).ok);
  if(fPer.afijo) l = l.filter(p => (p.afijo||"") === fPer.afijo);
  const cols = [
    {t:"Ejemplar", s:p=>p.nombre, r:p=>`<span class="celda-nm">${p.avatar?`<img class="thumb" src="${p.avatar}" alt="" loading="lazy">`:avatar(p,34,"cuadrado")}
      <span><span class="nm">${esc(p.nombre)}</span>${p.afijo?`<div class="mini">${esc(p.afijo)}</div>`:""}</span></span>`},
    {t:"Afijo", s:p=>p.afijo||"", r:p=>afijoChip(p)},
    {t:"Var.", s:p=>p.variedad, r:p=>chipVar(p.variedad)},
    {t:"Sexo", s:p=>p.sexo, r:p=>`<span class="sexo">${p.sexo==="M"?"♂":"♀"}</span>`},
    {t:"Nacimiento", s:p=>p.fechaNacimiento||"", r:p=>`<span class="num">${fmtF(p.fechaNacimiento)}</span><div class="mini">${edadTxt(meses(p.fechaNacimiento))}</div>`},
    {t:"LOE", s:p=>p.loe||"", r:p=>`<span class="num">${esc(p.loe||"—")}</span>`},
    {t:"Anexo A", s:p=>R.anexoA(p).ok?1:0, r:p=>{const a=R.anexoA(p); return a.ok?`<span class="chip ok">Completo</span>`:a.bloqueos.length?`<span class="chip block">Excluido</span>`:`<span class="chip warn">${a.items.filter(i=>i.e==="falta").length} pendientes</span>`;}},
    {t:"Aptos de cría", s:p=>R.aptosDe(p,res).length, r:p=>chipApto(R.aptosDe(p,res))},
    {t:"Sin validar", s:p=>R.pendientes(p,res).total, r:p=>{const n=R.pendientes(p,res).total; return n?`<span class="chip warn">${n}</span>`:`<span class="dim">—</span>`;}},
    {t:"Propietario", s:p=>p.propietarioNombre||"", r:p=>p.propietarioId ? esc(nombreSocio(p.propietarioId)) : esc(p.propietarioNombre||"—")},
  ];
  return `<div class="filters">
      <input class="inp" id="f-per-q" placeholder="Nombre, afijo, LOE, chip…" value="${esc(fPer.q)}" style="min-width:200px">
      <select class="inp" id="f-per-var"><option value="">Todas las variedades</option>${VARIEDADES.map(v=>`<option ${fPer.var===v?"selected":""}>${esc(v)}</option>`).join("")}</select>
      <select class="inp" id="f-per-sexo"><option value="">Ambos sexos</option><option value="M" ${fPer.sexo==="M"?"selected":""}>Machos</option><option value="H" ${fPer.sexo==="H"?"selected":""}>Hembras</option></select>
      <select class="inp" id="f-per-apto"><option value="">Con y sin apto</option><option value="si" ${fPer.apto==="si"?"selected":""}>Con algún apto</option><option value="no" ${fPer.apto==="no"?"selected":""}>Sin apto</option>${FIGURAS.map(f=>`<option value="${f.c}" ${fPer.apto===f.c?"selected":""}>${f.c} — ${esc(f.n)}</option>`).join("")}</select>
      <select class="inp" id="f-per-afijo"><option value="">Todos los afijos</option>${
        [...new Set(perrosVisibles().map(p=>p.afijo).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"))
          .map(a=>`<option ${fPer.afijo===a?"selected":""}>${esc(a)}</option>`).join("")}</select>
      <select class="inp" id="f-per-salud"><option value="">Salud: cualquiera</option><option value="completa" ${fPer.salud==="completa"?"selected":""}>Anexo A completo</option><option value="pendiente" ${fPer.salud==="pendiente"?"selected":""}>Anexo A pendiente</option></select>
      <span class="spacer"></span><span class="mini">${l.length} ejemplares</span>
    </div>${tabla("per", cols, l, p=>"perro/"+p.id)}`;
};

        if(r.tipo==="trabajo") return `<span class="chip ok">${esc(r.titulo||"—")}</span>${r.calificacion?` <span class="chip">${esc(r.calificacion)}</span>`:""}`;
        return `<span class="chip ${r.resultado==="APTO"?"ok":"block"}">${esc(r.modalidad?r.modalidad+" · ":"")}${esc(r.resultado||"—")}</span>`;}},

      <div class="card"><div class="card-h"><h3>Puntuación del club</h3><span class="hint">Cap. 7</span></div><div class="card-b">

          {t:"Apto de cría propio (categoría A)", d:R.aptosDe(p,res).length?"Lo tiene":"Sin apto propio", e:R.aptosDe(p,res).length?"ok":"falta", r:"RSA exige apto propio; rsB no"},

        <div class="meta">${chipVar(p.variedad)}<span class="chip">${p.sexo==="M"?"Macho ♂":"Hembra ♀"}</span>
          <span class="chip mono">${esc(p.loe||"sin LOE")}</span>

/* --- Aptos de cría (matriz) --- */
V.aptos = function(){
  const res = C("resultados");
  const l = perrosVisibles().map(p => ({p, figs: R.figurasDe(p, res)}));
  const cols = [
    {t:"Ejemplar", s:x=>x.p.nombre, r:x=>`<span class="nm">${esc(x.p.nombre)}</span><div class="mini">${esc(x.p.variedad||"")} · ${x.p.sexo==="M"?"♂":"♀"}</div>`},
    {t:"Edad", s:x=>meses(x.p.fechaNacimiento)||0, r:x=>`<span class="num">${edadTxt(meses(x.p.fechaNacimiento))}</span>`},
    {t:"Anexo A", s:x=>R.anexoA(x.p).ok?1:0, r:x=>{const a=R.anexoA(x.p);return a.ok?`<span class="chip ok">✓</span>`:a.bloqueos.length?`<span class="chip block">✕</span>`:`<span class="chip warn">${a.items.filter(i=>i.e==="falta").length}</span>`;}},
    ...FIGURAS.map(f => ({t:f.c, via:f.via, s:x=>{const g=x.figs.find(y=>y.fig.c===f.c);return g.cumple?2:g.excluido?0:1;},
      r:x=>{const g=x.figs.find(y=>y.fig.c===f.c);
        return g.cumple?`<span class="chip ok">Cumple</span>`:g.excluido?`<span class="chip block">Excluido</span>`:`<span class="chip warn" title="${esc(g.items.filter(i=>i.e!=="ok").map(i=>i.t).join(" · "))}">Faltan ${g.faltan}</span>`;}})),
  ];
  const casi = l.filter(x => x.figs.some(f => !f.cumple && !f.excluido && f.faltan === 1));
  if(!l.length) return `<div class="card"><div class="empty"><b>Sin ejemplares que evaluar</b>
    Esta pantalla cruza cada perro registrado con las cinco figuras del Capítulo 2 y señala qué le falta a cada uno.
    ${SES.rol!=="visitante"?`<div style="margin-top:14px"><button class="btn brand" data-form="perro|">Dar de alta un ejemplar</button></div>`:""}</div></div>`;
  return `<div class="note" style="margin-bottom:14px">Cada columna es una de las cinco figuras del <b>Capítulo 2</b>. Pasa el cursor sobre un aviso para ver qué falta exactamente.</div>
    ${casi.length?`<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>A un solo requisito del apto</h3><span class="hint">${casi.length} ejemplares</span></div>
      <div class="card-b" style="padding:0"><table>${casi.map(x=>{const f=x.figs.find(y=>!y.cumple&&!y.excluido&&y.faltan===1);
        return `<tr class="clic" data-go="perro/${esc(x.p.id)}"><td><span class="nm">${esc(x.p.nombre)}</span></td><td><span class="chip">${f.fig.c}</span></td>
        <td>${esc(f.items.find(i=>i.e!=="ok").t)}<div class="mini">${esc(f.items.find(i=>i.e!=="ok").d)}</div></td></tr>`;}).join("")}</table></div></div>`:""}
    ${tabla("apt", cols, l, x=>"perro/"+x.p.id)}`;
};

/* --- Simulador de cruce --- */
let cruceSel = {m:"", h:""};
V.cruce = function(){
  const perros = perrosVisibles(), res = C("resultados");
  const machos = perros.filter(p=>p.sexo==="M"), hembras = perros.filter(p=>p.sexo==="H");
  if(!cruceSel.m && machos.length) cruceSel.m = machos[0].id;
  if(!cruceSel.h && hembras.length) cruceSel.h = hembras[0].id;
  const m = byId(perros, cruceSel.m), h = byId(perros, cruceSel.h);
  let panel = perros.length
    ? `<div class="empty"><b>Elige los dos reproductores</b>Se comprueban edad, Anexo A, genética y variedades contra el reglamento.</div>`
    : `<div class="empty"><b>Aún no hay ejemplares registrados</b>El simulador compara dos reproductores contra el reglamento; primero hay que dar de alta al menos un macho y una hembra.
        ${SES.rol!=="visitante"?`<div style="margin-top:14px"><button class="btn brand" data-form="perro|">Dar de alta un ejemplar</button></div>`:""}</div>`;
  if(m && h){
    const l = R.cruce(m, h, C("perros"), res), v = R.cruceVeredicto(l);
    const orden = {bloqueo:0, aviso:1, ok:2};
    l.sort((a,b)=>orden[a.n]-orden[b.n]);
    panel = `<div class="note ${v==="bloqueo"?"block":v==="aviso"?"warn":"ok"}" style="margin-bottom:14px">
        ${v==="bloqueo"?"<b>Cruce no autorizable.</b> Hay incumplimientos del reglamento que lo impiden."
        :v==="aviso"?"<b>Cruce posible con condiciones.</b> Revisa los avisos antes de solicitarlo a la Comisión de Cría."
        :"<b>Cruce conforme al reglamento.</b> Ambos reproductores cumplen los requisitos comprobables."}</div>
      ${listaReq(l.map(x=>({t:x.t, d:x.r||"", e:x.n==="bloqueo"?"no":x.n==="aviso"?"falta":"ok"})))}
      ${R.esInter(m,h) ? (()=>{ const sol = solicitudDe(m.id,h.id); const e = sol?EST_SOL[sol.estado]:null;
        return `<div class="card lift" style="margin-top:16px"><div class="card-h"><h3>Autorización previa del club</h3>
          <span class="spacer"></span>${sol?`<span class="chip ${e.c}">${esc(e.t)}</span>`:`<span class="chip warn">Sin solicitar</span>`}</div>
          <div class="card-b">
            <div class="note ${sol&&sol.estado==="autorizada"?"ok":"warn"}">${sol&&sol.estado==="autorizada"
              ? "Cruce autorizado por la Junta Directiva. La camada podrá declararse y difundirse."
              : sol&&sol.estado==="denegada" ? "Este cruce fue denegado. La camada no puede publicarse."
              : sol ? "Expediente presentado y pendiente de resolución. Hasta que se resuelva, la camada no se publica."
              : "Este cruce necesita autorización previa de la Comisión de Cría antes de realizarse. Sin ella, la camada queda retenida y no se difunde."}</div>
            ${!sol&&SES.rol!=="visitante"?`<div style="margin-top:12px"><button class="btn brand" data-form="solicitud|${esc(m.id)}~${esc(h.id)}">Solicitar autorización</button></div>`:""}
            ${sol?`<div style="margin-top:12px"><button class="btn" data-go="intervar">Ver el expediente</button></div>`:""}
          </div></div>`; })() : ""}
      ${GENES.some(g=>((m.salud?.genes||{})[g.k]==="portador")||((h.salud?.genes||{})[g.k]==="portador")) ? `
      <div class="card" style="margin-top:16px"><div class="card-h"><h3>Previsión genética de la camada</h3></div><div class="card-b">
        ${GENES.map(g=>{const a=(m.salud?.genes||{})[g.k]||"?", b=(h.salud?.genes||{})[g.k]||"?";
          let pred = "No calculable: falta algún análisis";
          if(a==="libre"&&b==="libre") pred="100 % libres";
          else if((a==="portador"&&b==="libre")||(a==="libre"&&b==="portador")) pred="50 % libres · 50 % portadores · 0 % afectados";
          else if(a==="portador"&&b==="portador") pred="25 % libres · 50 % portadores · 25 % AFECTADOS — cruce prohibido";
          return `<div class="req"><div class="tx"><b>${g.k}</b><small>${esc(pred)}</small></div></div>`;}).join("")}
      </div></div>`:""}`;
  }
  const opt = (l, sel) => l.map(p=>`<option value="${esc(p.id)}" ${sel===p.id?"selected":""}>${esc(p.nombre)}${p.variedad?" · "+p.variedad:""}</option>`).join("");
  return `<div class="cols23">
    <div>${panel}</div>
    <div class="grid">
      <div class="card"><div class="card-h"><h3>Reproductores</h3></div><div class="card-b">
        <div class="f" style="margin-bottom:12px"><label>Macho</label>
          <select class="inp" id="cr-m"><option value="">— elegir —</option>${opt(machos, cruceSel.m)}</select></div>
        <div class="f"><label>Hembra</label>
          <select class="inp" id="cr-h"><option value="">— elegir —</option>${opt(hembras, cruceSel.h)}</select></div>
      </div></div>
      <div class="card"><div class="card-h"><h3>Cruces intervariedades autorizados</h3><span class="hint">Cap. 8.2</span></div><div class="card-b">
        ${CRUCES_INTER.map(c=>`<div class="req"><div class="tx"><b>${esc(c.a)} × ${esc(c.b)}</b><small>${esc(c.nota)}</small></div></div>`).join("")}
        <div class="note" style="margin-top:10px">Cualquier otra unión directa entre variedades está prohibida. Las autorizadas requieren solicitud previa con informe motivado, pedigrís, radiografías y ADN.</div>
      </div></div>
    </div></div>`;
};

/* --- Autorización de cruce intervariedades (Cap. 8) --- */
const EST_SOL = {
  pendiente:  {t:"Pendiente de resolución", c:"warn"},
  autorizada: {t:"Autorizada",              c:"ok"},
  denegada:   {t:"Denegada",                c:"block"},
};
function solicitudDe(machoId, hembraId){
  return C("solicitudes").find(x => x.machoId === machoId && x.hembraId === hembraId) || null;
}
/* Una camada intervariedades sólo se difunde si su cruce está autorizado */
function camadaPublicable(c){
  const m = byId(C("perros"), c.padreId), h = byId(C("perros"), c.madreId);
  if(!R.esInter(m, h)) return {ok:true};
  const sol = solicitudDe(c.padreId, c.madreId);
  if(sol && sol.estado === "autorizada") return {ok:true, sol};
  return {ok:false, sol, motivo: !sol ? "Cruce intervariedades sin expediente de autorización"
    : sol.estado === "denegada" ? "La Junta Directiva denegó este cruce" : "Expediente pendiente de resolución"};
}

V.intervar = function(){
  const todas = C("solicitudes").filter(x => x.tipo === "intervariedad");
  const soc = SES.rol === "admin" ? todas : todas.filter(x => x.criadorId === SES.socioId);
  const orden = {pendiente:0, autorizada:1, denegada:2};
  const l = soc.slice().sort((a,b) => (orden[a.estado]-orden[b.estado]) || String(b.fecha).localeCompare(String(a.fecha)));
  const tarjeta = x => {
    const m = byId(C("perros"), x.machoId), h = byId(C("perros"), x.hembraId), cr = byId(C("socios"), x.criadorId);
    const ev = (m && h) ? R.intervariedad(m, h, {criador:cr, pagos:C("pagos"), resultados:C("resultados")}) : null;
    const e = EST_SOL[x.estado] || EST_SOL.pendiente;
    const dias = x.fecha ? Math.floor((Date.now() - new Date(x.fecha)) / 86400000) : 0;
    return `<div class="card lift" style="margin-bottom:14px">
      <div class="card-h"><h3>${esc(m?.nombre||"?")} <span class="dim">×</span> ${esc(h?.nombre||"?")}</h3>
        <span class="chip">${esc(m?.variedad||"?")} × ${esc(h?.variedad||"?")}</span>
        <span class="spacer"></span><span class="chip ${e.c}">${esc(e.t)}</span></div>
      <div class="card-b">
        <dl class="kv" style="margin-bottom:14px">
          <dt>Criador</dt><dd>${cr?`<a class="linkish" data-go="socio/${esc(cr.id)}">${esc(cr.nombreCompleto)}</a>`:"—"}</dd>
          <dt>Línea solicitada</dt><dd>${esc(x.linea||"—")}</dd>
          <dt>Presentada</dt><dd>${fmtF(x.fecha)}${x.estado==="pendiente"?` <span class="mini">· ${dias} de 30 días hábiles</span>`:""}</dd>
          ${x.motivo?`<dt>Motivación</dt><dd style="font-weight:400">${esc(x.motivo)}</dd>`:""}
          ${x.resolucion?`<dt>Resolución</dt><dd style="font-weight:400">${esc(x.resolucion)} <span class="mini">· ${fmtF(x.fechaResolucion)}</span></dd>`:""}
        </dl>
        ${ev?`<div class="eyebrow" style="margin-bottom:7px">Documentación exigida por el Capítulo 8</div>${listaReq(ev.items)}`:""}
        ${SES.rol==="admin"&&x.estado==="pendiente"?`<div style="margin-top:14px;display:flex;gap:8px">
          <button class="btn brand" data-sol="autorizada|${esc(x.id)}">Autorizar el cruce</button>
          <button class="btn danger" data-sol="denegada|${esc(x.id)}">Denegar</button></div>`:""}
        ${x.estado==="autorizada"?`<div class="note ok" style="margin-top:12px">Autorizado. La camada que nazca de este cruce puede declararse y difundirse; la resolución se traslada también a la RSCE.</div>`:""}
      </div></div>`;
  };
  const pend = l.filter(x=>x.estado==="pendiente");
  return `<div class="note" style="margin-bottom:16px">Las uniones directas entre variedades están prohibidas. Las tres combinaciones admitidas exigen <b>autorización previa</b>: la Comisión de Cría informa y la Junta Directiva resuelve en <b>30 días hábiles</b>. Hasta entonces la camada no se publica ni se difunde. <span class="rule-src">Cap. 8</span></div>
    ${SES.rol==="admin"&&pend.length?`<div class="note warn" style="margin-bottom:16px"><b>${pend.length} expediente(s) esperando resolución de la Junta Directiva.</b></div>`:""}
    ${l.length ? l.map(tarjeta).join("")
      : `<div class="card"><div class="empty"><b>Sin expedientes</b>Los cruces entre variedades se solicitan desde el simulador de cruce, eligiendo los dos reproductores.
         <div style="margin-top:14px"><button class="btn brand" data-go="cruce">Ir al simulador de cruce</button></div></div></div>`}`;
};

/* --- Camadas --- */
V.camadas = function(){
  const cols = [
    {t:"Nacimiento", s:c=>c.fechaNacimiento||"", r:c=>`<span class="num">${fmtF(c.fechaNacimiento)}</span>`},

    {t:"Padres", s:c=>c.madreId||"", r:c=>{const m=byId(C("perros"),c.madreId),p=byId(C("perros"),c.padreId);
      return `${esc(p?.nombre||"?")} <span class="dim">×</span> ${esc(m?.nombre||"?")}`;}},
    {t:"Cachorros", s:c=>(c.nMachos||0)+(c.nHembras||0), r:c=>`<span class="num">${(c.nMachos||0)+(c.nHembras||0)}</span> <span class="mini">${c.nMachos||0}♂ ${c.nHembras||0}♀</span>`},
    {t:"LOE camada", s:c=>c.loeCamada||"", r:c=>`<span class="num">${esc(c.loeCamada||"—")}</span>`},
    {t:"Comunicación", s:c=>c.fechaComunicacion||"", r:c=>{
      if(!c.fechaNacimiento) return `<span class="dim">—</span>`;
      if(!c.fechaComunicacion) { const d = Math.floor((Date.now()-new Date(c.fechaNacimiento))/86400000);
        return d>30?`<span class="chip block">Fuera de plazo (${d} días)</span>`:`<span class="chip warn">Pendiente · ${30-d} días</span>`; }
      const d = Math.floor((new Date(c.fechaComunicacion)-new Date(c.fechaNacimiento))/86400000);
      return d<=30?`<span class="chip ok">En plazo</span>`:`<span class="chip block">Tardía (${d} días)</span>`;}},
    {t:"Difusión", s:c=>c.recomendada?1:0, r:c=>{
      const pb = camadaPublicable(c);
      if(!pb.ok) return `<span class="chip block" title="${esc(pb.motivo)}">Retenida</span>`;
      return c.recomendada?`<span class="chip ok">Recomendada</span>`:`<span class="chip">No difundida</span>`;}},
  ];
  return `<div class="note" style="margin-bottom:14px">Para que una camada aparezca en las herramientas de difusión del club debe comunicarse <b>dentro de los 30 días</b> siguientes al nacimiento con los datos de los progenitores y el número y sexo de los cachorros (Cap. 6.1).</div>
    ${SES.rol!=="visitante"?`<div style="margin-bottom:12px"><button class="btn primary" data-form="camada|">Declarar camada</button></div>`:""}
    ${tabla("cam", cols, C("camadas"))}`;
};

      <div class="card-b" style="padding:0"><table>${mias.map(i=>{const e=byId(C("eventos"),i.eventoId),p=byId(C("perros"),i.perroId),s=byId(C("socios"),i.socioId);
        return `<tr><td>${esc(e?.nombre||"—")}<div class="mini">${fmtF(e?.fecha)}</div></td><td>${esc(p?.nombre||"—")}</td>
        ${SES.rol==="admin"?`<td>${esc(s?.nombreCompleto||"—")}</td>`:""}<td><span class="chip">${esc(i.clase||i.modalidad||"—")}</span></td>
        <td style="text-align:right"><span class="chip ${i.estado==="confirmada"?"ok":"warn"}">${esc(i.estado||"pendiente")}</span></td></tr>`;}).join("")}</table></div></div>`:""}

/* ============================================================
   Fotos y vídeos
   Las fotos se reducen en el navegador antes de guardarse.
   Los vídeos se enlazan: alojarlos requiere almacenamiento propio.
   ============================================================ */
const MED = {porSujeto:{}, cargando:{}};

function cargarMedia(sujetoId){
  if(!sujetoId || MED.porSujeto[sujetoId] || MED.cargando[sujetoId]) return;
  MED.cargando[sujetoId] = true;
  if(!S.db){ MED.porSujeto[sujetoId] = []; MED.cargando[sujetoId] = false; return; }
  S.db.collection("media").where("sujetoId", "==", sujetoId).get()
    .then(snap => { MED.porSujeto[sujetoId] = snap.docs.map(d => Object.assign({id:d.id}, d.data())); })
    .catch(() => { MED.porSujeto[sujetoId] = []; })
    .then(() => { MED.cargando[sujetoId] = false; render(); });
}
function mediaDe(sujetoId){
  cargarMedia(sujetoId);
  return MED.porSujeto[sujetoId] || null;   // null = todavía cargando
}
function olvidarMedia(sujetoId){ delete MED.porSujeto[sujetoId]; delete MED.cargando[sujetoId]; }

/* Reduce una imagen a JPEG dentro del límite de un documento (256 KiB) */
function procesarImagen(file, opts){
  return new Promise((res, rej) => {
    if(!file) return rej(new Error("No se ha elegido ningún archivo"));
    if(!/^image\//.test(file.type)) return rej(new Error("Ese archivo no es una imagen. Admitimos JPG, PNG, WEBP o HEIC convertido."));
    if(file.size > 30 * 1024 * 1024) return rej(new Error("La imagen pesa más de 30 MB. Redúcela antes de subirla."));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("No se pudo leer el archivo"));
    fr.onload = () => procesarFuente(fr.result, opts).then(res, rej);
    fr.readAsDataURL(file);
  });
}
function procesarFuente(src, {max = 1200, cuadrada = false, calidad = 0.78} = {}){
  return new Promise((res, rej) => {
    {
      const im = new Image();
      im.onerror = () => rej(new Error("El navegador no reconoce ese formato de imagen"));
      im.onload = () => {
        let sx = 0, sy = 0, sw = im.width, sh = im.height;
        if(cuadrada){ const l = Math.min(sw, sh); sx = (sw - l) / 2; sy = (sh - l) / 2; sw = sh = l; }
        const c = document.createElement("canvas"), g = c.getContext("2d");
        const dibujar = (lado, q) => {
          const k = Math.min(1, lado / Math.max(sw, sh));
          const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));
          c.width = w; c.height = h;
          g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h);
          g.drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
          return {dataUri: c.toDataURL("image/jpeg", q), w, h};
        };
        /* Se baja primero la calidad y después la resolución hasta entrar en el
           límite de 256 KiB por documento. Una foto normal entra en el primer intento. */
        const intentos = [[max, calidad], [max, 0.62], [max * 0.78, 0.6], [max * 0.62, 0.55],
                          [max * 0.5, 0.5], [max * 0.38, 0.45], [max * 0.28, 0.4]];
        for(const [lado, q] of intentos){
          const r = dibujar(Math.max(180, Math.round(lado)), q);
          if(r.dataUri.length <= 185000)
            return res({dataUri: r.dataUri, w: r.w, h: r.h, bytes: Math.round(r.dataUri.length * 0.75)});
        }
        rej(new Error("No se ha podido reducir esta imagen lo suficiente. Prueba con otra."));
      };
      im.src = src;
    }
  });
}

const PROVEEDORES = [
  {re:/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/i, n:"YouTube"},
  {re:/vimeo\.com\/(\d+)/i, n:"Vimeo"},
  {re:/instagram\.com\/(?:p|reel|tv)\/([\w-]+)/i, n:"Instagram"},
  {re:/facebook\.com\/.+\/videos\/(\d+)/i, n:"Facebook"},
  {re:/working-dog\.(?:com|eu)\//i, n:"working-dog"},
];
function proveedorDe(url){
  const p = PROVEEDORES.find(x => x.re.test(url || ""));
  return p ? p.n : (/^https?:\/\//i.test(url || "") ? "Enlace externo" : "");
}

let filtroInv = "pendientes";
V.invitaciones = function(){
  const socios = C("socios").slice().sort((a,b)=>(a.numero||0)-(b.numero||0));
  const conEmail = socios.filter(s => s.email);
  const sinEmail = socios.filter(s => !s.email);
  const est = s => (s.invitacion||{}).estado || "no_enviada";
  const grupos = {
    pendientes: conEmail.filter(s => est(s) === "no_enviada"),
    enviadas:   conEmail.filter(s => est(s) === "enviada"),
    aceptadas:  conEmail.filter(s => est(s) === "aceptada"),
  };
  const l = grupos[filtroInv] || [];
  const chipEst = s => ({no_enviada:`<span class="chip">Sin invitar</span>`,
    enviada:`<span class="chip warn">Invitada ${fmtF((s.invitacion||{}).fecha)}</span>`,
    aceptada:`<span class="chip ok">Perfil reclamado</span>`})[est(s)];
  return `<div class="note" style="margin-bottom:16px">Cada invitación lleva un <b>enlace personal de un solo uso</b>: es lo que ata la cuenta al número de socio y evita que nadie reclame un perfil ajeno. Envíalas de una en una mientras pruebas; el estado de cada una queda registrado aquí.</div>
    <div class="stats" style="margin-bottom:16px">
      <div class="stat"><div class="k">Invitables</div><div class="v">${conEmail.length}</div><div class="n">Con correo en secretaría</div></div>
      <div class="stat"><div class="k">Enviadas</div><div class="v">${grupos.enviadas.length}</div><div class="n">Esperando que entren</div></div>
      <div class="stat"><div class="k">Reclamados</div><div class="v">${grupos.aceptadas.length}</div><div class="n">Ya usan la plataforma</div></div>
      <div class="stat"><div class="k">Sin correo</div><div class="v">${sinEmail.length}</div><div class="n">Reclamación manual en secretaría</div></div>
    </div>
    <div class="filters">
      <div class="seg">${[["pendientes","Sin invitar"],["enviadas","Enviadas"],["aceptadas","Reclamados"]]
        .map(([k,n])=>`<button data-inv-f="${k}" class="${filtroInv===k?"on":""}">${n} (${grupos[k].length})</button>`).join("")}</div>
      <span class="spacer"></span><span class="mini">${l.length} socio(s)</span>
    </div>
    <div class="tw"><table><thead><tr><th class="nos">Nº</th><th class="nos">Socio</th><th class="nos">Correo</th><th class="nos">Estado</th><th class="nos"></th></tr></thead>
      <tbody>${l.length ? l.map(s => `<tr>
        <td class="num">${esc(s.numero)}</td>
        <td><span class="nm">${esc(s.nombreCompleto)}</span>${s.provincia?`<div class="mini">${esc(s.provincia)}</div>`:""}</td>
        <td class="num">${esc(s.email)}</td>
        <td>${chipEst(s)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn sm" data-inv="ver|${esc(s.id)}">${est(s)==="no_enviada"?"Preparar invitación":"Ver invitación"}</button>
          ${est(s)==="enviada"?`<button class="btn sm" data-inv="reclamada|${esc(s.id)}" title="Marcar que ya ha entrado">Marcar reclamado</button>`:""}
        </td></tr>`).join("") : `<tr><td colspan="5"><div class="empty" style="padding:30px">Nada en esta lista</div></td></tr>`}
      </tbody></table></div>
    ${sinEmail.length?`<div class="note warn" style="margin-top:16px"><b>${sinEmail.length} socios no tienen correo en el fichero de secretaría.</b> No se les puede invitar: reclaman su perfil a mano con nº de socio, DNI y teléfono, y la secretaría lo aprueba. Los tienes listados en «Vinculación de altas».</div>`:""}`;
};

let formActual = null;
function campo(f){
  const v = f.v ?? "";
  if(f.tipo === "select")
    return `<div class="f ${f.wide?"wide":""}"><label>${esc(f.l)}</label><select class="inp" name="${f.k}">${
      f.op.map(o => { const [val,txt] = Array.isArray(o)?o:[o,o||"— sin dato —"];
        return `<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(txt)}</option>`;}).join("")}</select>${f.h?`<span class="hint2">${esc(f.h)}</span>`:""}</div>`;
  if(f.tipo === "textarea")
    return `<div class="f wide"><label>${esc(f.l)}</label><textarea class="inp" name="${f.k}" placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>${f.h?`<span class="hint2">${esc(f.h)}</span>`:""}</div>`;
  if(f.tipo === "checks")
    return `<div class="f wide"><label>${esc(f.l)}</label>
      <div class="checks">${f.op.map(o => `<label class="chk"><input type="checkbox" name="${f.k}::${esc(o)}" ${(f.v||[]).includes(o)?"checked":""}> ${esc(o)}</label>`).join("")}</div>
      ${f.h?`<span class="hint2">${esc(f.h)}</span>`:""}</div>`;
  if(f.tipo === "check")
    return `<div class="f ${f.wide?"wide":""}"><label style="display:flex;gap:7px;align-items:center;cursor:pointer">
      <input type="checkbox" name="${f.k}" ${v?"checked":""}> ${esc(f.l)}</label>${f.h?`<span class="hint2">${esc(f.h)}</span>`:""}</div>`;
  return `<div class="f ${f.wide?"wide":""}"><label>${esc(f.l)}</label>
    <input class="inp" type="${f.tipo||"text"}" name="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||"")}">${f.h?`<span class="hint2">${esc(f.h)}</span>`:""}</div>`;
}
function grupos(gs){
  return gs.map(g => `<fieldset class="fset"><legend>${esc(g.t)}</legend>${g.d?`<div class="note" style="margin-bottom:11px">${g.d}</div>`:""}
    <div class="fgrid">${g.f.map(campo).join("")}</div></fieldset>`).join("");
}
function abrirForm(titulo, gs, onOk){
  formActual = onOk;
  $("#sheet-t").textContent = titulo;
  $("#sheet-b").innerHTML = grupos(gs);
  $("#sheet-ok").textContent = "Guardar";
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
}
function cerrarForm(){ $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); formActual = null; }
function leerForm(){
  const o = {};
  $("#sheet-b").querySelectorAll("[name]").forEach(el => {
    const n = el.name;
    if(n.includes("::")){                     // grupo de casillas -> lista
      const [k, v] = n.split("::");
      o[k] = o[k] || [];
      if(el.checked) o[k].push(v);
      return;
    }
    o[n] = el.type === "checkbox" ? el.checked : el.value.trim();
  });
  return o;
}

  socio:["Perfil","Ficha pública de socio"],

  camadas:["Camadas","Declaración y difusión de camadas"],
  eventos:["Eventos","Convocatorias e inscripciones"],
  yo:["Mi perfil","Tus datos, tus perros y qué comparte cada uno"],
